server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript image/svg+xml;

    # Статические ассеты с hash в имени файла — иммутабельный кеш на год
    location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html — без кеша (браузер всегда переспрашивает)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # SPA-роутинг: всё что не файл → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
